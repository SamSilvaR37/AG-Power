<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dimensionamento Solar Autoral</title>
<!--
  "Dimensionamento Solar Autoral — Inversor 5 kW" (9:16, 85 s).
  Direção de arte própria: infográfico isométrico + HUD de engenharia sobre blueprint digital.
  Inversor e módulos são desenhos genéricos, sem marca, gerados aqui em isometria.
  Exemplo educativo HIPOTÉTICO (briefing em briefing.json).
  Parâmetros: ?t=12.5  ?render=1
  Render: node ../render.mjs 9x16 --pagina dimensionamento-5kw-autoral/index.html --nome dimensionamento-5kw-autoral
-->
<style>
:root{
  --bg:#0F172A; --ink:#F8FAFC; --amber:#F59E0B; --sky:#38BDF8; --green:#22C55E; --red:#EF4444;
  --panel:rgba(15,23,42,.78); --edge:rgba(56,189,248,.38); --mute:#94A3B8; --dim:#475569;
  --u:10.8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020617;overflow:hidden}
body{font-family:Inter,"Inter Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-weight:500}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:var(--bg);flex:none;transform-origin:center center}
/* blueprint digital: grade fina + grade maior + leve granulado */
.blueprint{position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 50% 40%,rgba(56,189,248,.07),transparent 60%),
    linear-gradient(rgba(56,189,248,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.10) 1px,transparent 1px),
    linear-gradient(rgba(56,189,248,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.045) 1px,transparent 1px),
    radial-gradient(rgba(248,250,252,.035) 1px,transparent 1.2px);
  background-size:100% 100%,calc(var(--u)*10) calc(var(--u)*10),calc(var(--u)*10) calc(var(--u)*10),calc(var(--u)*2) calc(var(--u)*2),calc(var(--u)*2) calc(var(--u)*2),calc(var(--u)*.7) calc(var(--u)*.7)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(2,6,23,.75))}
.scene{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.art{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.amber{color:var(--amber)} .sky{color:var(--sky)} .green{color:var(--green)} .red{color:var(--red)} .mute{color:var(--mute)}

/* HUD global: indicador de etapa e cantoneiras */
.hud{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*10);top:calc(var(--u)*16.5);z-index:40;display:flex;flex-direction:column;gap:calc(var(--u)*.9)}
.hud .lbl{display:flex;justify-content:space-between;font-weight:800;font-size:calc(var(--u)*1.75);letter-spacing:.16em;text-transform:uppercase;color:var(--sky)}
.hud .lbl span:last-child{color:var(--mute);letter-spacing:.08em}
.hud .seg{display:grid;grid-template-columns:repeat(8,1fr);gap:calc(var(--u)*.6)}
.hud .seg i{height:calc(var(--u)*.55);border-radius:99px;background:rgba(56,189,248,.18)}
.hud .seg i.on{background:var(--sky)} .hud .seg i.now{background:var(--amber)}
.corner{position:absolute;width:calc(var(--u)*4);height:calc(var(--u)*4);border:2px solid rgba(56,189,248,.45);z-index:40}

/* textos */
.ttl{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*10);top:calc(var(--u)*23);font-weight:800;font-size:calc(var(--u)*6);line-height:1.04;letter-spacing:-.02em}
.ttl small{display:block;font-size:calc(var(--u)*1.8);font-weight:700;letter-spacing:.16em;color:var(--sky);margin-bottom:calc(var(--u)*1)}
/* títulos escritos em maiúsculas à mão para não estragar unidades (kW, Wp, Voc) */

/* cards de HUD */
.card{background:var(--panel);border:1px solid var(--edge);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*2) calc(var(--u)*2.2);position:relative;backdrop-filter:blur(2px)}
.card::before,.card::after{content:"";position:absolute;width:calc(var(--u)*1.8);height:calc(var(--u)*1.8);border-color:var(--sky);border-style:solid}
.card::before{left:-1px;top:-1px;border-width:3px 0 0 3px;border-top-left-radius:calc(var(--u)*1.6)}
.card::after{right:-1px;bottom:-1px;border-width:0 3px 3px 0;border-bottom-right-radius:calc(var(--u)*1.6)}
.k{font-size:calc(var(--u)*1.7);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.v{font-weight:800;font-size:calc(var(--u)*4.2);letter-spacing:-.01em;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:calc(var(--u)*.8);border-radius:calc(var(--u)*.9);padding:calc(var(--u)*.8) calc(var(--u)*1.6);font-weight:800;font-size:calc(var(--u)*2.3);white-space:nowrap}
.chip.g{background:rgba(34,197,94,.15);color:var(--green)} .chip.r{background:rgba(239,68,68,.15);color:var(--red)} .chip.a{background:rgba(245,158,11,.15);color:var(--amber)} .chip.s{background:rgba(56,189,248,.14);color:var(--sky)}

/* legendas: faixa inferior de alto contraste, palavras-chave em âmbar */
.cap{position:absolute;left:0;right:0;top:calc(var(--u)*120);z-index:45;display:flex;justify-content:center;padding:0 calc(var(--u)*10) 0 calc(var(--u)*6)}
.cap div{width:100%;text-align:center;font-weight:800;font-size:calc(var(--u)*3.7);line-height:1.25;padding:calc(var(--u)*1.3) calc(var(--u)*1.6);background:linear-gradient(90deg,rgba(2,6,23,0),rgba(2,6,23,.88) 12%,rgba(2,6,23,.88) 88%,rgba(2,6,23,0));border-top:1px solid rgba(56,189,248,.35);border-bottom:1px solid rgba(56,189,248,.35)}
.cap b{color:var(--amber);font-weight:800}
/* varredura da transição */
.scan{position:absolute;left:0;right:0;height:3px;background:var(--sky);box-shadow:0 0 calc(var(--u)*2) var(--sky),0 0 calc(var(--u)*6) rgba(56,189,248,.6);z-index:44;opacity:0}

/* cena 2 */
#s2 .grid4{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*10);top:calc(var(--u)*46);display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.6)}
#s2 .card{height:calc(var(--u)*30);display:flex;flex-direction:column;justify-content:space-between}
#s2 .n{font-weight:800;font-size:calc(var(--u)*1.8);color:var(--sky);letter-spacing:.14em}
#s2 .big{font-weight:800;font-size:calc(var(--u)*8.5);letter-spacing:-.03em;line-height:1}
#s2 .nm{font-weight:800;font-size:calc(var(--u)*3.4)}
#s2 .bar{height:calc(var(--u)*.8);border-radius:99px;background:rgba(56,189,248,.15);overflow:hidden}
#s2 .bar i{display:block;height:100%;background:var(--amber);border-radius:99px}
/* cena 3 */
#s3 .rows{position:absolute;left:calc(var(--u)*50);right:calc(var(--u)*10);top:calc(var(--u)*40);display:flex;flex-direction:column;gap:calc(var(--u)*1.8)}
#s3 .rowc{padding:calc(var(--u)*1.5) calc(var(--u)*1.8);transition:none}
#s3 .rowc .v{font-size:calc(var(--u)*3.8)}
#s3 .rowc.hl{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 calc(var(--u)*3) rgba(245,158,11,.25)}
#s3 .rowc.hl::before,#s3 .rowc.hl::after{border-color:var(--amber)}
/* cena 4 */
.callout{position:absolute;padding:calc(var(--u)*1.2) calc(var(--u)*1.6)}
.callout .v{font-size:calc(var(--u)*3.6)}
/* cena 5/6/7 */
.formula{font-weight:800;font-size:calc(var(--u)*5);letter-spacing:-.01em;white-space:nowrap}
.gauge{position:relative;height:calc(var(--u)*4.4);border-radius:calc(var(--u)*1);background:rgba(56,189,248,.12);border:1px solid var(--edge)}
.gauge .f{position:absolute;left:0;top:0;bottom:0;border-radius:calc(var(--u)*1);background:linear-gradient(90deg,#0ea5e9,#38BDF8)}
.gauge .lim{position:absolute;top:calc(var(--u)*-1.2);bottom:calc(var(--u)*-1.2);width:4px;background:var(--amber);border-radius:2px}
.stats{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*10);display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*1.4)}
.stats .card{padding:calc(var(--u)*1.6) calc(var(--u)*1);text-align:center}
.stats .v{font-size:calc(var(--u)*4.4)}
.stats .k{font-size:calc(var(--u)*1.45);letter-spacing:.06em}
/* cena 8 */
#s8 .check{display:flex;align-items:center;gap:calc(var(--u)*1.8);font-weight:800;font-size:calc(var(--u)*3);padding:calc(var(--u)*1.6) 0;border-bottom:1px solid rgba(56,189,248,.18)}
#s8 .box{width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);border-radius:calc(var(--u)*1);border:3px solid var(--dim);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*3);color:transparent;flex:none}
#s8 .box.on{border-color:var(--green);background:rgba(34,197,94,.18);color:var(--green)}
#s8 .final{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*10);top:calc(var(--u)*86);border:3px solid var(--amber);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*2.4);text-align:center;font-weight:800;font-size:calc(var(--u)*3.7);line-height:1.2;background:rgba(245,158,11,.08)}

#ctl[hidden]{display:none}
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 14px;background:rgba(2,6,23,.92);font:13px Inter,system-ui,sans-serif;color:#cbd5e1;z-index:100}
#ctl button{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
#ctl input[type=range]{flex:1}
#ctl .tc{font-variant-numeric:tabular-nums;min-width:120px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#172554"/><stop offset="1" stop-color="#0b1a3d"/></linearGradient>
    <linearGradient id="invFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    <linearGradient id="invSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>
<div id="wrap"><div id="stage"></div></div>
<div id="ctl" hidden>
  <button id="play">▶︎</button>
  <span class="tc" id="tc">0.0 s</span>
  <input id="scrub" type="range" min="0" max="85" step="0.01" value="0">
  <span id="scn"></span>
</div>
<script>
"use strict";
/* ================= exemplo educativo hipotético (briefing) ================= */
const INV = { kw: 5, kwpRec: 7.5, vMax: 600, vStart: 100, mppts: 2, iMax: 16 };
const MOD = { wp: 550, voc: 49.9, vmp: 41.8, imp: 13.16, isc: 13.9 };
const N = 6;
const V_STR = N * MOD.vmp;            // 250,8 V
const KWP = 2 * N * MOD.wp / 1000;    // 6,6 kWp

/* ================= utilidades (mesmo motor dos outros vídeos) ================= */
const Q = new URLSearchParams(location.search);
const [W,H] = [1080,1920];
const U = W/100;
const clamp = (x,a=0,b=1) => Math.min(b,Math.max(a,x));
const eo = x => 1-Math.pow(1-x,3);
const eio = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const back = x => { const c=1.7; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
const lerp = (a,b,k) => a+(b-a)*k;
const p = (t,a,d=.5,fn=eo) => fn(clamp((t-a)/d));
const $ = (root,s) => root.querySelector(s);
const $$ = (root,s) => [...root.querySelectorAll(s)];
function css(el,o){ if(!el) return; for(const k in o) el.style[k]=o[k]; }
/** entra deslizando de lado (dx em u) */
function slide(el,t,a,d=.5,dx=8){ if(!el) return; const k=p(t,a,d); el.style.opacity=k; el.style.transform=`translateX(${(1-k)*dx*U}px)`; }
function rise(el,t,a,d=.5,dy=2.5){ if(!el) return; const k=p(t,a,d); el.style.opacity=k; el.style.transform=`translateY(${(1-k)*dy*U}px)`; }
function pop(el,t,a,d=.45){ if(!el) return; const k=clamp((t-a)/d); el.style.opacity=clamp(k*2.5); el.style.transform=`scale(${k<=0?.7:lerp(.7,1,back(k))})`; }
function setText(el,txt){ if(el && el.textContent!==txt) el.textContent=txt; }
const nf = (v,d=1) => v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const count = (t,a,d,from,to) => lerp(from,to,p(t,a,d,eo));
const ticks = (a,d,step=.08) => Array.from({length:Math.floor(d/step)},(_,i)=>[+(a+i*step).toFixed(3),"tick"]);
/** desenha um traço SVG (pathLength="1") até a fração k */
function draw(el,k){ if(!el) return; el.style.strokeDasharray = 1; el.style.strokeDashoffset = 1-k; }

const I = {
  bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  gauge:'<path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>',
  wave:'<path d="M2 12h3l3-8 4 16 3-8h7"/>',
  split:'<path d="M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM15 6a9 9 0 0 0-9 9"/>',
};
const ic = n => `<svg class="ico" viewBox="0 0 24 24">${I[n]}</svg>`;

/* ================= desenho isométrico (equipamentos genéricos, sem marca) ================= */
/** projeção isométrica: mundo (x, y, z) → tela, a partir da origem o e da escala s (px por unidade) */
const iso = (o, s) => (x, y, z=0) => [o[0] + (x - y) * 0.866 * s, o[1] + (x + y) * 0.5 * s - z * s];
const pts = a => a.map(q => q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
const poly = (a, attrs) => `<polygon points="${pts(a)}" ${attrs}/>`;

/** módulo FV inclinado: moldura preta fina, células azul-escuras; borda traseira mais alta */
function isoModule(P, x0, y0, o={}){
  const w=o.w??1, h=o.h??1.65, tilt=o.tilt??.42, cols=o.cols??6, rows=o.rows??10, fr=.05, gap=.012, th=.06;
  const Qp = (u,v,dz=0) => P(x0+u*w, y0+v*h, (1-v)*tilt + dz);
  let g = "";
  g += poly([P(x0,y0,-.6),P(x0+w,y0,-.6),P(x0+w,y0+h,-.6),P(x0,y0+h,-.6)], 'fill="#000" opacity=".25"');
  g += poly([Qp(0,1),Qp(1,1),Qp(1,1,-th),Qp(0,1,-th)], 'fill="#05070c"');
  g += poly([Qp(1,0),Qp(1,1),Qp(1,1,-th),Qp(1,0,-th)], 'fill="#0b0f17"');
  g += poly([Qp(0,0),Qp(1,0),Qp(1,1),Qp(0,1)], 'fill="#0a0d14" stroke="#1f2937" stroke-width="1"');
  const cw = (1-2*fr)/cols, ch = (1-2*fr)/rows;
  for (let j=0;j<rows;j++) for (let i=0;i<cols;i++){
    const u0=fr+i*cw+gap, u1=fr+(i+1)*cw-gap, v0=fr+j*ch+gap, v1=fr+(j+1)*ch-gap;
    g += poly([Qp(u0,v0),Qp(u1,v0),Qp(u1,v1),Qp(u0,v1)], 'fill="url(#cell)"');
  }
  // reflexo diagonal discreto
  g += poly([Qp(.08,.05),Qp(.32,.05),Qp(.12,.45),Qp(.05,.45)], 'fill="#93c5fd" opacity=".07"');
  return g;
}
/** pontos úteis do módulo (bordas da frente) para ligar cabos */
const modPorts = (P, x0, y0, w=1, h=1.65) => ({ neg: P(x0+.2*w, y0+h, -.03), pos: P(x0+.8*w, y0+h, -.03), mid: P(x0+.5*w, y0+h, -.03) });

/** inversor genérico em isometria 3/4: corpo cinza-claro fosco, lateral grafite, LCD no canto superior direito,
 *  dois LEDs e entradas na parte de baixo da frente */
function isoInverter(P, x0, y0, o={}){
  const Wd=o.w??1.1, D=o.d??.42, Hh=o.h??1.5, s=o.s;
  const F = (u,v) => P(x0+u*Wd, y0+D, v*Hh);          // frente (plano y = y0+D)
  const Sd = (u,v) => P(x0+Wd, y0+u*D, v*Hh);         // lateral (plano x = x0+Wd)
  let g = "";
  g += poly([P(x0,y0,-.02),P(x0+Wd,y0,-.02),P(x0+Wd,y0+D,-.02),P(x0,y0+D,-.02)].map(q=>[q[0]+s*.25,q[1]+s*.12]), 'fill="#000" opacity=".28"');
  g += poly([Sd(0,0),Sd(1,0),Sd(1,1),Sd(0,1)], 'fill="url(#invSide)"');
  for (let k=1;k<7;k++){ const v=.12+k*.11; g += `<line x1="${Sd(.1,v)[0]}" y1="${Sd(.1,v)[1]}" x2="${Sd(.9,v)[0]}" y2="${Sd(.9,v)[1]}" stroke="#1e293b" stroke-width="2"/>`; }
  g += poly([F(0,0),F(1,0),F(1,1),F(0,1)], 'fill="url(#invFront)"');
  g += poly([P(x0,y0,Hh),P(x0+Wd,y0,Hh),P(x0+Wd,y0+D,Hh),P(x0,y0+D,Hh)], 'fill="#f1f5f9"');
  // faixa grafite inferior com as entradas
  g += poly([F(0,0),F(1,0),F(1,.17),F(0,.17)], 'fill="#334155"');
  // contorno suave das arestas
  g += `<polyline points="${pts([F(0,0),F(0,1),P(x0,y0,Hh),P(x0+Wd,y0,Hh),Sd(1,1),F(1,1),F(0,1)])}" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>`;
  // LCD no canto superior direito
  g += poly([F(.55,.72),F(.9,.72),F(.9,.88),F(.55,.88)], 'fill="#0F172A" stroke="#64748b" stroke-width="1.5"');
  const lcd = F(.58,.86), k = s;
  g += `<g transform="matrix(${.866*k*Wd},${.5*k*Wd},0,${k*Hh},${lcd[0]},${lcd[1]})"><text x="0" y=".085" font-family="Inter,sans-serif" font-weight="800" font-size=".075" fill="#F59E0B" transform="scale(${1/Wd} ${1/Hh})">${o.label??"5 kW"}</text></g>`;
  // dois LEDs
  [[.62,.64,"#22C55E"],[.7,.64,"#38BDF8"]].forEach(([u,v,c]) => { const q=F(u,v); g += `<ellipse cx="${q[0]}" cy="${q[1]}" rx="${s*.022}" ry="${s*.022}" fill="${c}" filter="url(#glow)"/>`; });
  // entradas: dois pares (MPPT 1 e MPPT 2)
  const ins = [];
  [.18,.30,.62,.74].forEach(u => { const q=F(u,.07); ins.push(q); g += `<ellipse cx="${q[0]}" cy="${q[1]}" rx="${s*.035}" ry="${s*.045}" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>`; });
  return { svg: g, inputs: ins, front: F };
}

/* ================= cenas ================= */
const SCENES = []; const S = o => SCENES.push(o);

/* ---------- 1. Gancho (7 s) ---------- */
S({ id:1, name:"Gancho inicial", dur:6.5, step:"A pergunta",
  cap:["Quantas placas solares você pode ligar", "em um inversor de *cinco quilowatts*", "sem errar no *dimensionamento*?"],
  html(){
    const P = iso([U*44, U*49], U*6);
    let mods = "";
    for (let r=0;r<4;r++) for (let c=0;c<3;c++) mods += `<g class="m" data-i="${r*3+c}">${isoModule(P, c*1.25, r*1.95)}</g>`;
    const Pi = iso([U*68, U*84], U*15);
    const inv = isoInverter(Pi, 0, 0, { s:U*15 });
    return `<svg class="art"><g class="cluster">${mods}</g><g class="inv">${inv.svg}</g>

let VIEW_SCALE = 1;
stage.innerHTML = `<div class="blueprint"></div><div class="vignette"></div>`;
for (const s of ACTIVE){ const el = document.createElement("section"); el.className="scene"; el.id="s"+s.id; el.innerHTML=s.html(); stage.appendChild(el); s.el=el; }
// HUD global
const hud = document.createElement("div"); hud.className = "hud";
hud.innerHTML = `<div class="lbl"><span class="st"></span><span class="nn"></span></div><div class="seg">${ACTIVE.map(()=>"<i></i>").join("")}</div>`;
stage.appendChild(hud);
const corners = [["left","top","2px 0 0 2px"],["right","top","2px 2px 0 0"],["left","bottom","0 0 2px 2px"],["right","bottom","0 2px 2px 0"]];
corners.forEach(([h,v,bw])=>{ const c=document.createElement("div"); c.className="corner"; c.style[h]=`${U*2.4}px`; c.style[v]=`${U*2.4}px`; c.style.borderWidth=bw; stage.appendChild(c); });
const scan = document.createElement("div"); scan.className = "scan"; stage.appendChild(scan);

/* legendas: trechos com duração proporcional ao texto, respiro de 0,3 s no começo e no fim da cena */
const CAPS = ACTIVE.flatMap(s => {
  const tot = s.cap.reduce((a,c)=>a+c.replace(/\*/g,"").length,0);
  let t = s.start + .3; const util = s.dur - .6;
  return s.cap.map(c => { const d = util * c.replace(/\*/g,"").length / tot; const o = { a:t, b:t+d, txt:c }; t += d; return o; });
});
const capEl = document.createElement("div"); capEl.className = "cap"; capEl.innerHTML = "<div></div>"; stage.appendChild(capEl);
const capHtml = s => s.replace(/\*(.+?)\*/g,"<b>$1</b>");

function renderAt(T){
  T = clamp(T,0,TOTAL);
  let scanY = -1;
  ACTIVE.forEach((s,i)=>{
    const local = T - s.start, next = ACTIVE[i+1];
    const visible = local >= 0 && (local < s.dur || (next && local < s.dur + XF) || (!next && local <= s.dur));
    if (!visible){ s.el.style.visibility="hidden"; return; }
    s.el.style.visibility = "visible";
    // transição: varredura técnica de cima para baixo revelando a cena nova
    // a cena antiga é recortada de forma complementar (some onde a nova já apareceu), sem sobreposição
    if (i > 0 && local < XF){ const k = eio(clamp(local/XF)); s.el.style.clipPath = `inset(0 0 ${(1-k)*100}% 0)`; scanY = k*H; }
    else if (next && local >= s.dur){ const k = eio(clamp((local-s.dur)/XF)); s.el.style.clipPath = `inset(${k*100}% 0 0 0)`; }
    else s.el.style.clipPath = "none";
    s.update(s.el, Math.min(local, s.dur + XF), s.dur);
  });
  css(scan,{opacity: scanY >= 0 ? 1 : 0, top: (scanY-1.5)+"px"});
  // HUD de etapas
  const idx = Math.max(0, ACTIVE.findIndex(s => T >= s.start && T < s.start + s.dur));
  const cur = T >= TOTAL ? ACTIVE.length-1 : idx;
  setText($(hud,".st"), ACTIVE[cur].step);
  setText($(hud,".nn"), `${String(cur+1).padStart(2,"0")} / ${String(ACTIVE.length).padStart(2,"0")}`);
  $$(hud,".seg i").forEach((e,i)=>{ e.className = i < cur ? "on" : i === cur ? "now" : ""; });
  hud.style.opacity = p(T,.2,.5);
  // legenda
  const c = CAPS.find(c => T >= c.a && T < c.b), box = capEl.firstChild;
  if (c){ const h = capHtml(c.txt); if (box.innerHTML !== h) box.innerHTML = h; capEl.style.opacity = clamp((T-c.a)/.12); }
  else capEl.style.opacity = 0;
  stage.style.filter = T > TOTAL-.6 ? `brightness(${clamp((TOTAL-T)/.6)*.6+.4})` : "none";
  return T;
}
const SFX = [...ACTIVE.flatMap(s => (s.sfx||[]).map(([t,k]) => ({ t: +(s.start+t).toFixed(3), k }))),
             ...ACTIVE.slice(1).map(s => ({ t: +s.start.toFixed(3), k: "swish" }))];
// trilha leve tecnológica: pad + arpejo, sem bateria, discreta
const MUSIC = { bpm: 100, arp: 1, kick: 9999, hat: 30, clap: 9999, prog: "vi-IV-I-V" };
window.COMMERCIAL = { W, H, FMT:"9x16", CUT:false, TOTAL, SFX, MUSIC,
  CAPS: CAPS.map(c => ({ a:+c.a.toFixed(3), b:+c.b.toFixed(3), txt:c.txt.replace(/\*/g,"") })),
  scenes: ACTIVE.map(s=>({id:s.id,name:s.name,start:s.start,dur:s.dur})) };
window.renderAt = renderAt;

function fit(){
  const ctlH = Q.get("render") ? 0 : 56;
  VIEW_SCALE = Math.min(innerWidth/W, (innerHeight-ctlH)/H);
  stage.style.transform = `scale(${VIEW_SCALE})`;
  document.getElementById("wrap").style.bottom = ctlH+"px";
}
if (Q.get("render")){
  document.getElementById("wrap").style.cssText = "position:absolute;left:0;top:0;display:block";
  VIEW_SCALE = 1; renderAt(+Q.get("t")||0);
} else {
  addEventListener("resize",fit); fit();
  const ctl = document.getElementById("ctl"); ctl.hidden = false;
  const scrub = document.getElementById("scrub"), tc = document.getElementById("tc"), scn = document.getElementById("scn"), play = document.getElementById("play");
  scrub.max = TOTAL;
  let t = +Q.get("t")||0, playing = !Q.get("t"), last = performance.now();
  const audio = new Audio("../videos/dimensionamento-5kw-autoral-85s-9x16.mp4"); audio.preload = "auto";
  const syncAudio = () => { if (!audio.error){ audio.currentTime = t; playing ? audio.play().catch(()=>{}) : audio.pause(); } };
  const show = () => { renderAt(t); scrub.value = t; tc.textContent = t.toFixed(1)+" s / "+TOTAL+" s"; const s = ACTIVE.find(s=>t>=s.start && t<s.start+s.dur) || ACTIVE[ACTIVE.length-1]; scn.textContent = `Cena ${s.id} — ${s.name}`; play.textContent = playing ? "❚❚" : "▶︎"; };
  play.onclick = () => { playing = !playing; if (t>=TOTAL) t=0; syncAudio(); show(); };
  scrub.oninput = () => { t = +scrub.value; syncAudio(); show(); };
  addEventListener("keydown", e => { if (e.code==="Space"){ e.preventDefault(); play.click(); } });
  const loop = now => { const dt = (now-last)/1000; last = now; if (playing){ t += dt; if (t>=TOTAL){ t=TOTAL; playing=false; audio.pause(); } } show(); requestAnimationFrame(loop); };
  if (playing) syncAudio();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
