<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comercial AG Power</title>
<!--
  Comercial "Plataforma AG Power" — 90 s, animado em HTML.
  Cada quadro é função pura do tempo (window.renderAt(t)), então o mesmo arquivo
  serve para assistir no navegador e para renderizar o MP4 (ver render.mjs).

  Parâmetros de URL:
    ?f=16x9 | 9x16 | 1x1   formato (padrão 16x9)
    ?cut=60                versão curta (sem as cenas 3, 4 e 6)
    ?t=12.5                abre parado nesse segundo
    ?render=1              modo de renderização (sem controles, sem autoplay)
-->
<style>
:root{
  --navy:#0a1120; --navy2:#101a2e; --navy3:#16223a; --navy4:#1d2b47; --line:#26355a;
  --sun:#f7a531; --sun2:#f2913d; --sun-soft:rgba(247,165,49,.16);
  --ink:#f3f6fb; --mute:#8e9bb5; --dim:#5d6a85;
  --ok:#34c38f; --bad:#ef5b5b; --warn:#f5b83d; --wa:#25d366;
  --u:10.8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05080f;overflow:hidden}
body{font-family:Inter,"Inter Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:var(--navy);flex:none;transform-origin:center center}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;overflow:hidden}
.bg-glow{position:absolute;inset:0;background:
  radial-gradient(calc(var(--u)*90) calc(var(--u)*60) at 85% 10%,rgba(247,165,49,.10),transparent 70%),
  radial-gradient(calc(var(--u)*80) calc(var(--u)*60) at 10% 100%,rgba(60,110,220,.12),transparent 70%)}

/* tipografia */
.h1{font-weight:800;font-size:calc(var(--u)*6.2);line-height:1.04;letter-spacing:-.02em}
.h2{font-weight:800;font-size:calc(var(--u)*4.4);line-height:1.08;letter-spacing:-.015em}
.h3{font-weight:700;font-size:calc(var(--u)*2.6);line-height:1.15}
.p{font-weight:400;font-size:calc(var(--u)*2.2);line-height:1.35;color:var(--mute)}
.sun{color:var(--sun)}
.kicker{font-weight:700;font-size:calc(var(--u)*1.6);letter-spacing:.18em;text-transform:uppercase;color:var(--sun)}
.tag{display:inline-flex;align-items:center;gap:calc(var(--u)*.8);padding:calc(var(--u)*.9) calc(var(--u)*1.6);border-radius:999px;background:var(--sun-soft);color:var(--sun);font-weight:700;font-size:calc(var(--u)*1.9);white-space:nowrap}
.tag svg{width:1.1em;height:1.1em}

/* ícones */
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* dispositivos */
.phone{position:relative;width:calc(var(--u)*29);height:calc(var(--u)*60);border-radius:calc(var(--u)*4.4);background:#05070d;padding:calc(var(--u)*1.1);box-shadow:0 calc(var(--u)*3) calc(var(--u)*7) rgba(0,0,0,.55),inset 0 0 0 calc(var(--u)*.25) #2a3550;flex:none}
.ph-screen{position:relative;width:100%;height:100%;border-radius:calc(var(--u)*3.4);background:var(--navy2);overflow:hidden}
.ph-status{position:absolute;top:0;left:0;right:0;height:calc(var(--u)*4);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*2.4);font-size:calc(var(--u)*1.3);font-weight:600;z-index:5}
.ph-notch{position:absolute;top:calc(var(--u)*1);left:50%;width:calc(var(--u)*8);height:calc(var(--u)*2.2);transform:translateX(-50%);background:#05070d;border-radius:999px;z-index:6}
.ph-body{position:absolute;top:calc(var(--u)*4.4);left:0;right:0;bottom:0;padding:calc(var(--u)*1.6)}
.laptop{position:relative;width:calc(var(--u)*92);flex:none}
.lp-screen{position:relative;width:100%;aspect-ratio:16/10;border-radius:calc(var(--u)*1.6) calc(var(--u)*1.6) 0 0;background:#05070d;padding:calc(var(--u)*1.2);box-shadow:0 calc(var(--u)*3) calc(var(--u)*7) rgba(0,0,0,.5),inset 0 0 0 calc(var(--u)*.25) #2a3550}
.lp-inner{position:relative;width:100%;height:100%;background:var(--navy2);border-radius:calc(var(--u)*.6);overflow:hidden}
.lp-base{height:calc(var(--u)*2);margin:0 calc(var(--u)*-5);border-radius:0 0 calc(var(--u)*2) calc(var(--u)*2);background:linear-gradient(#2b3654,#151d30)}

/* peças de interface */
.card{background:var(--navy3);border:1px solid var(--line);border-radius:calc(var(--u)*1.4);padding:calc(var(--u)*1.4)}
.bar{height:calc(var(--u)*.9);border-radius:999px;background:var(--navy4)}
.bar.s{background:var(--sun)}
.row{display:flex;align-items:center;gap:calc(var(--u)*1)}
.col{display:flex;flex-direction:column;gap:calc(var(--u)*1)}
.btn{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.8);border-radius:calc(var(--u)*1.2);background:var(--sun);color:#1a1205;font-weight:800;font-size:calc(var(--u)*1.7);padding:calc(var(--u)*1.3)}
.btn.ghost{background:var(--navy4);color:var(--ink);border:1px solid var(--line)}
.lbl{font-size:calc(var(--u)*1.2);color:var(--mute);font-weight:500}
.val{font-size:calc(var(--u)*1.5);font-weight:700}
.dot{width:calc(var(--u)*1);height:calc(var(--u)*1);border-radius:50%;background:var(--ok);flex:none}
.app-head{display:flex;align-items:center;gap:calc(var(--u)*1);font-weight:800;font-size:calc(var(--u)*1.8);margin-bottom:calc(var(--u)*1.4)}
.app-head .ico{color:var(--sun)}
.logo-img{display:block;object-fit:contain}
.cursor{position:absolute;left:0;top:0;width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);z-index:50;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.ripple{position:absolute;width:calc(var(--u)*6);height:calc(var(--u)*6);margin:calc(var(--u)*-3) 0 0 calc(var(--u)*-3);border-radius:50%;border:calc(var(--u)*.35) solid var(--sun);opacity:0;z-index:49;pointer-events:none}

/* ---------- cena 1 ---------- */
#s1 svg.sky{position:absolute;inset:0;width:100%;height:100%}
#s1 .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,17,32,.0) 0%,rgba(10,17,32,.86) 38%,var(--navy) 70%)}
#s1 .title{position:absolute;left:0;right:0;bottom:16%;text-align:center;padding:0 calc(var(--u)*4)}
#s1 .loc{position:absolute;left:calc(var(--u)*4);top:calc(var(--u)*4);font-weight:600;font-size:calc(var(--u)*1.7);color:rgba(255,255,255,.85);display:flex;gap:calc(var(--u)*.6);align-items:center}
#s1 .sunball{position:absolute;left:0;top:0;width:calc(var(--u)*16);height:calc(var(--u)*16);margin:calc(var(--u)*-8) 0 0 calc(var(--u)*-8);border-radius:50%;
  background:radial-gradient(circle,#fff6d8 0%,#ffd36b 35%,#f7a531 62%,rgba(247,165,49,0) 72%)}

/* ---------- cena 2 ---------- */
#s2 .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3)}
#s2 .brand{display:flex;align-items:center;gap:calc(var(--u)*1.6)}
#s2 .brand img{width:calc(var(--u)*7);height:calc(var(--u)*7)}
#s2 .devices{position:relative;display:flex;align-items:flex-end;gap:calc(var(--u)*-6)}
#s2 .devices .laptop{width:calc(var(--u)*78)}
#s2 .devices .phone{width:calc(var(--u)*19);height:calc(var(--u)*39);margin-left:calc(var(--u)*-8);margin-bottom:calc(var(--u)*-1)}
#s2 .icons{display:flex;gap:calc(var(--u)*2.4)}
#s2 .feat{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.8);width:calc(var(--u)*13)}
#s2 .feat .ib{width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);border-radius:calc(var(--u)*1.8);background:var(--sun-soft);color:var(--sun);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*3.2)}
#s2 .feat span{font-size:calc(var(--u)*1.55);font-weight:600;text-align:center;line-height:1.15}
#s2 .head{text-align:center}
#s2 .dash{position:absolute;inset:0;display:grid;grid-template-columns:18% 1fr;}
#s2 .dash .side{background:#0c1528;padding:calc(var(--u)*1.4);display:flex;flex-direction:column;gap:calc(var(--u)*1.1)}
#s2 .dash .main{padding:calc(var(--u)*1.6);display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;gap:calc(var(--u)*1.1)}

/* ---------- cena 3 ---------- */
#s3 .lay{position:absolute;inset:calc(var(--u)*5);display:flex;flex-direction:column;gap:calc(var(--u)*2.4)}
#s3 .top{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2)}
#s3 .split{flex:1;display:grid;grid-template-columns:1fr calc(var(--u)*6) 1fr;gap:0;align-items:stretch;min-height:0}
#s3 .sheet{align-self:start;background:#f4f6f8;color:#1c2333;border-radius:calc(var(--u)*1.2);overflow:hidden;display:flex;flex-direction:column}
#s3 .sheet .tb{background:#1f7a4a;color:#fff;font-weight:700;font-size:calc(var(--u)*1.5);padding:calc(var(--u)*1) calc(var(--u)*1.4);display:flex;gap:calc(var(--u)*.8);align-items:center}
#s3 table{border-collapse:collapse;width:100%;font-size:calc(var(--u)*1.45)}
#s3 th{background:#e3e7ec;font-weight:700;text-align:left;padding:calc(var(--u)*.8) calc(var(--u)*1);border:1px solid #cfd5dd;color:#4a5468}
#s3 td{padding:calc(var(--u)*.85) calc(var(--u)*1);border:1px solid #d9dee5;white-space:nowrap;height:calc(var(--u)*3.6)}
#s3 tr.hl td{background:#fff3cf}
#s3 td.chg{background:#ffe08a !important;font-weight:700}
#s3 .arrow{display:flex;align-items:center;justify-content:center;color:var(--sun);font-size:calc(var(--u)*3.4)}
#s3 .agenda{background:var(--navy2);border:1px solid var(--line);border-radius:calc(var(--u)*1.2);display:flex;flex-direction:column;overflow:hidden}
#s3 .ag-head{display:grid;grid-template-columns:calc(var(--u)*5) repeat(3,1fr);font-weight:700;font-size:calc(var(--u)*1.45);color:var(--mute);border-bottom:1px solid var(--line)}
#s3 .ag-head div{padding:calc(var(--u)*1)}
#s3 .ag-body{position:relative;flex:1;display:grid;grid-template-columns:calc(var(--u)*5) 1fr}
#s3 .hours{display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--u)*.6) 0;font-size:calc(var(--u)*1.15);color:var(--dim);text-align:center}
#s3 .grid{position:relative;background:
  linear-gradient(90deg,transparent calc(33.33% - 1px),var(--line) calc(33.33% - 1px),var(--line) 33.33%,transparent 33.33%,transparent calc(66.66% - 1px),var(--line) calc(66.66% - 1px),var(--line) 66.66%,transparent 66.66%)}
#s3 .ev{position:absolute;width:31%;height:13%;margin-left:1%;border-radius:calc(var(--u)*.8);background:var(--sun-soft);border-left:calc(var(--u)*.45) solid var(--sun);padding:calc(var(--u)*.5) calc(var(--u)*.8);font-size:calc(var(--u)*1.25);line-height:1.2;overflow:hidden}
#s3 .ev b{display:block;font-size:calc(var(--u)*1.35);color:var(--ink)}
#s3 .ev small{color:var(--mute);font-size:calc(var(--u)*1.15)}
#s3 .ev .badge{position:absolute;right:calc(var(--u)*.6);top:calc(var(--u)*.6);font-size:calc(var(--u)*1.6)}
#s3 .toast{position:absolute;right:calc(var(--u)*2);bottom:calc(var(--u)*2);display:flex;align-items:center;gap:calc(var(--u)*1.2);background:var(--navy3);border:1px solid var(--ok);border-radius:calc(var(--u)*1.4);padding:calc(var(--u)*1.2) calc(var(--u)*1.6);box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgba(0,0,0,.4);z-index:5}
#s3 .toast .ico{font-size:calc(var(--u)*2.6);color:var(--ok)}
#s3 .sync .ico{animation:none}

/* ---------- cena 4 ---------- */
#s4 .lay{position:absolute;inset:calc(var(--u)*5);display:grid;grid-template-columns:1fr 1.15fr;gap:calc(var(--u)*4);align-items:center}
#s4 .list{display:flex;flex-direction:column;gap:calc(var(--u)*1.2)}
#s4 .item{display:grid;grid-template-columns:calc(var(--u)*7) 1fr auto;align-items:center;gap:calc(var(--u)*1.2);background:var(--navy3);border:1px solid var(--line);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.3) calc(var(--u)*1.6);font-size:calc(var(--u)*1.7)}
#s4 .item .t{color:var(--sun);font-weight:800}
#s4 .item .n{font-weight:700}
#s4 .item .n.link{text-decoration:underline;text-decoration-color:rgba(247,165,49,.6);text-underline-offset:.2em}
#s4 .item .s{color:var(--mute);font-size:calc(var(--u)*1.4)}
#s4 .os{position:relative;background:var(--navy2);border:1px solid var(--line);border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*2.4);box-shadow:0 calc(var(--u)*3) calc(var(--u)*7) rgba(0,0,0,.5);transform-origin:20% 30%}
#s4 .os .fields{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.2);margin:calc(var(--u)*1.8) 0}
#s4 .os .f{background:var(--navy3);border:1px solid var(--line);border-radius:calc(var(--u)*1);padding:calc(var(--u)*1.1) calc(var(--u)*1.3)}
#s4 .os .f.flash{border-color:var(--sun);background:rgba(247,165,49,.12)}
#s4 .os .acts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.2)}
#s4 .menu{position:absolute;right:calc(var(--u)*2.4);bottom:calc(var(--u)*-11);width:calc(var(--u)*24);background:var(--navy4);border:1px solid var(--line);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.6);box-shadow:0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,.5);z-index:4}
#s4 .menu div{display:flex;align-items:center;gap:calc(var(--u)*1);padding:calc(var(--u)*.9) calc(var(--u)*1.1);border-radius:calc(var(--u)*.8);font-size:calc(var(--u)*1.6);font-weight:600}
#s4 .menu div.on{background:var(--sun-soft);color:var(--sun)}
#s4 .av{width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);border-radius:50%;background:var(--navy3);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*1.5);color:var(--sun);flex:none}
#s4 .texts{position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);bottom:calc(var(--u)*4);display:flex;justify-content:space-between;align-items:flex-end;gap:calc(var(--u)*2)}

/* ---------- cena 5 ---------- */
#s5 .lay{position:absolute;inset:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:calc(var(--u)*5);padding:0 calc(var(--u)*6)}
#s5 .phone{width:calc(var(--u)*33);height:calc(var(--u)*68)}
#s5 .illus{position:relative;height:calc(var(--u)*70);border-radius:calc(var(--u)*2.4);overflow:hidden}
#s5 .illus svg{position:absolute;inset:0;width:100%;height:100%}
#s5 .steps{display:flex;flex-direction:column;gap:calc(var(--u)*1.5)}
#s5 .step{display:flex;align-items:center;gap:calc(var(--u)*1.4);font-size:calc(var(--u)*2.3);font-weight:700;color:var(--dim)}
#s5 .step .ck{width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);border-radius:50%;border:calc(var(--u)*.25) solid var(--line);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*1.8);flex:none;color:transparent}
#s5 .step.on{color:var(--ink)} #s5 .step.on .ck{border-color:var(--sun);color:var(--sun)}
#s5 .step.done{color:var(--mute)} #s5 .step.done .ck{border-color:var(--ok);background:var(--ok);color:#06231a}
#s5 .scr{position:absolute;inset:0;padding:calc(var(--u)*5) calc(var(--u)*1.6) calc(var(--u)*1.6);opacity:0}
#s5 .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.7);margin-top:calc(var(--u)*1.2)}
#s5 .th{aspect-ratio:1;border-radius:calc(var(--u)*.8);background:
  repeating-linear-gradient(90deg,transparent 0 30%,rgba(255,255,255,.25) 30% 33%),
  repeating-linear-gradient(0deg,transparent 0 30%,rgba(255,255,255,.25) 30% 33%),
  linear-gradient(135deg,#1e3a6b,#3c6fb8 60%,#f7a531 140%)}
#s5 .mat{display:flex;align-items:center;justify-content:space-between;background:var(--navy3);border:1px solid var(--line);border-radius:calc(var(--u)*1);padding:calc(var(--u)*1.1) calc(var(--u)*1.2);font-size:calc(var(--u)*1.45);font-weight:600;margin-bottom:calc(var(--u)*.8)}
#s5 .box{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);border-radius:calc(var(--u)*.5);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*1.4);color:transparent}
#s5 .box.on{background:var(--ok);border-color:var(--ok);color:#06231a}
#s5 .yn{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*.8);font-size:calc(var(--u)*1.2);font-weight:600;padding:calc(var(--u)*.7) 0;border-bottom:1px solid var(--line)}
#s5 .seg{display:flex;border-radius:calc(var(--u)*.7);overflow:hidden;border:1px solid var(--line);flex:none}
#s5 .seg span{padding:calc(var(--u)*.35) calc(var(--u)*.8);font-size:calc(var(--u)*1.1);font-weight:700;color:var(--mute)}
#s5 .seg span.on{background:var(--ok);color:#06231a}
#s5 .fg{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.7);margin-top:calc(var(--u)*1)}
#s5 .fg .f{background:var(--navy3);border:1px solid var(--line);border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.7) calc(var(--u)*.9)}
#s5 .fg .bar{margin-top:calc(var(--u)*.5);height:calc(var(--u)*.7)}
#s5 .pad{position:relative;height:calc(var(--u)*15);background:#f4f6f8;border-radius:calc(var(--u)*1);margin:calc(var(--u)*.6) 0 calc(var(--u)*1.4)}
#s5 .pad svg{position:absolute;inset:0;width:100%;height:100%}
#s5 .pad .ln{position:absolute;left:8%;right:8%;bottom:22%;height:1px;background:#9aa4b5}
#s5 .banner{display:flex;align-items:center;gap:calc(var(--u)*.8);border-radius:calc(var(--u)*1);padding:calc(var(--u)*1) calc(var(--u)*1.2);font-size:calc(var(--u)*1.3);font-weight:700}
#s5 .banner.warn{background:rgba(245,184,61,.15);color:var(--warn)}
#s5 .banner.ok{background:rgba(52,195,143,.15);color:var(--ok)}
#s5 .banner.info{background:var(--sun-soft);color:var(--sun)}

/* ---------- cena 6 ---------- */
#s6 .lay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*8)}
#s6 .doc{position:relative;width:calc(var(--u)*46);height:calc(var(--u)*65);background:#fff;color:#1c2333;border-radius:calc(var(--u)*1);padding:calc(var(--u)*3);box-shadow:0 calc(var(--u)*3) calc(var(--u)*8) rgba(0,0,0,.55);display:flex;flex-direction:column;gap:calc(var(--u)*1.6)}
#s6 .doc .dh{display:flex;align-items:center;gap:calc(var(--u)*1.2);border-bottom:2px solid var(--sun);padding-bottom:calc(var(--u)*1.2)}
#s6 .doc .dh img{width:calc(var(--u)*4);height:calc(var(--u)*4)}
#s6 .doc .sec{font-size:calc(var(--u)*1.25);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7a8396;margin-bottom:calc(var(--u)*.6)}
#s6 .doc .ph{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*.7)}
#s6 .doc .ph div{aspect-ratio:1;border-radius:calc(var(--u)*.5);background:
  repeating-linear-gradient(90deg,transparent 0 30%,rgba(255,255,255,.3) 30% 33%),linear-gradient(135deg,#27477e,#4f86d1 60%,#f7a531 140%)}
#s6 .doc .tbl div{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e3e7ec;padding:calc(var(--u)*.55) 0;font-size:calc(var(--u)*1.2)}
#s6 .doc .tbl i{display:block;width:40%;height:calc(var(--u)*.7);border-radius:99px;background:#d9dee6}
#s6 .doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2)}

/* controles de pré-visualização */
#ctl[hidden]{display:none}
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 14px;background:rgba(5,8,15,.92);font:13px Inter,system-ui,sans-serif;color:#cfd6e4;z-index:100}

<body>
<div id="wrap"><div id="stage"></div></div>
<div id="ctl" hidden>
  <button id="play">▶︎</button>
  <span class="tc" id="tc">0.0 s</span>
  <input id="scrub" type="range" min="0" max="90" step="0.01" value="0">
  <span id="scn"></span>
  <button data-f="16x9">16:9</button><button data-f="9x16">9:16</button><button data-f="1x1">1:1</button>
  <button id="cut">60 s</button>
</div>
<script>
"use strict";
/* ================= utilidades ================= */
const Q = new URLSearchParams(location.search);
const FMT = ["16x9","9x16","1x1"].includes(Q.get("f")) ? Q.get("f") : "16x9";
const SIZES = {"16x9":[1920,1080],"9x16":[1080,1920],"1x1":[1080,1080]};
const [W,H] = SIZES[FMT];
const U = Math.min(W,H)/100;
const PORTRAIT = FMT === "9x16", SQUARE = FMT === "1x1";
const CUT = Q.get("cut") === "60";
const LOGO = "assets/logo-ag-power.png";

const clamp = (x,a=0,b=1) => Math.min(b,Math.max(a,x));
const eo = x => 1-Math.pow(1-x,3);
const eio = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const back = x => { const c=1.7; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
const lerp = (a,b,k) => a+(b-a)*k;
/** progresso 0..1 com easing a partir de `a` durante `d` segundos */
const p = (t,a,d=.5,fn=eo) => fn(clamp((t-a)/d));
const $ = (root,s) => root.querySelector(s);
const $$ = (root,s) => [...root.querySelectorAll(s)];
function css(el, o){ if(!el) return; for(const k in o) el.style[k]=o[k]; }
/** entrada padrão: sobe e aparece */
function rise(el,t,a,d=.55,dy=3){ if(!el) return; const k=p(t,a,d); el.style.opacity=k; el.style.transform=`translateY(${(1-k)*dy*U}px)`; }
function pop(el,t,a,d=.45){ if(!el) return; const k=clamp((t-a)/d); el.style.opacity=clamp(k*2.5); el.style.transform=`scale(${k<=0?.6:lerp(.6,1,back(k))})`; }
function fade(el,t,a,d=.4){ if(!el) return; el.style.opacity=p(t,a,d); }
function vis(el,on){ if(el) el.style.opacity = on?1:0; }
function cls(el,c,on){ if(el) el.classList.toggle(c,!!on); }
function setText(el,txt){ if(el && el.textContent!==txt) el.textContent=txt; }

/* ícones (traço, estilo lucide) */
const I = {
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  clipboard:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/>',
  hardhat:'<path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1z"/><path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/><path d="M4 15v-3a6 6 0 0 1 6-6M14 6a6 6 0 0 1 6 6v3"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  userplus:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  checkc:'<circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  box:'<path d="M21 8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
  pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  wifioff:'<path d="M12 20h.01M8.5 16.4a5 5 0 0 1 7 0M2 8.8a15 15 0 0 1 4.2-2.6M10.7 5.1A15 15 0 0 1 22 8.8M5 12.9a10 10 0 0 1 5.2-2.8M17.3 12.3c.6.3 1.2.6 1.7 1M2 2l20 20"/>',
  wifi:'<path d="M12 20h.01M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 14 0M2 8.8a15 15 0 0 1 20 0"/>',
  refresh:'<path d="M21 12a9 9 0 0 1-15 6.7L3 16M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2-5.4A8.4 8.4 0 1 1 21 11.5z"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  dots:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  alert:'<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  layout:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
  plug:'<path d="M12 22v-5M9 8V2M15 8V2M18 8v5a6 6 0 0 1-12 0V8z"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  phone:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
  map:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  sheet:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  ticket:'<path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4z"/>',
  history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
  route:'<circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/>',
  users:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
};
const ic = (n,extra="") => `<svg class="ico" viewBox="0 0 24 24" ${extra}>${I[n]}</svg>`;
const CURSOR = `<svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2L16 21l-3 1.4-3.6-6.8L4 20z" fill="#fff" stroke="#0a1120" stroke-width="1.4" stroke-linejoin="round"/></svg><div class="ripple"></div>`;

const phone = (inner, cls="", status=`<span>7:58</span><span class="sigw">${ic("wifi")}</span>`) =>
  `<div class="phone ${cls}"><div class="ph-screen"><div class="ph-notch"></div><div class="ph-status">${status}</div>${inner}</div></div>`;
const laptop = inner => `<div class="laptop"><div class="lp-screen"><div class="lp-inner">${inner}</div></div><div class="lp-base"></div></div>`;
const bars = (ws, cls="") => ws.map(w=>`<div class="bar ${cls}" style="width:${w}%"></div>`).join("");

/** posição do centro de um elemento em px do palco (ignora escala de pré-visualização) */
let VIEW_SCALE = 1;
function center(el, root){
  const r = el.getBoundingClientRect(), s = root.getBoundingClientRect();
  return [ (r.left + r.width/2 - s.left)/VIEW_SCALE, (r.top + r.height/2 - s.top)/VIEW_SCALE ];
}
/** cursor animado: path = [[t, alvoEl|[x,y]], ...]; clicks = [t,...] */
function driveCursor(root, t, path, clicks, start){
  const cur = $(root,".cursor"), rip = $(root,".ripple");
  const pts = path.map(([tt,tg]) => [tt, Array.isArray(tg) ? tg : center(tg, root)]);
  let pos = start;
  for (let i=0;i<pts.length;i++){
    const [tt,xy] = pts[i], prevT = i ? pts[i-1][0] : tt-.7, prev = i ? pts[i-1][1] : start;
    if (t >= tt) pos = xy;
    else { const k = eio(clamp((t-prevT-.05)/(tt-prevT-.05))); pos = [lerp(prev[0],xy[0],k), lerp(prev[1],xy[1],k)]; break; }
  }
  let press = 1, rp = -1;
  for (const c of clicks){ if (t>=c && t<c+.5){ rp=(t-c)/.5; } if (t>=c-.06 && t<c+.12) press=.85; }
  css(cur,{transform:`translate(${pos[0]-U*.5}px,${pos[1]-U*.4}px) scale(${press})`});
  css(rip,{left:pos[0]+"px",top:pos[1]+"px",opacity:rp<0?0:1-rp,transform:`scale(${rp<0?.3:lerp(.3,1.4,rp)})`});
}

/* ================= cenas ================= */
const SCENES = [];
const S = (o) => SCENES.push(o);

/* ---------- 1. Abertura ---------- */
S({ id:1, name:"Abertura — e depois da venda?", dur:6,
  html: () => `
    <svg class="sky" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="s1sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0d1a3a"/><stop offset=".45" stop-color="#3b3f73"/>
          <stop offset=".72" stop-color="#d9775a"/><stop offset="1" stop-color="#ffc36b"/>
        </linearGradient>
        <linearGradient id="s1pan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b3566"/><stop offset="1" stop-color="#0f2147"/></linearGradient>
        <linearGradient id="s1glint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#ffe6a8" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <clipPath id="s1clip"><polygon id="s1roofpoly"/></clipPath>
      </defs>
      <rect id="s1skyrect" width="${W}" height="${H}" fill="url(#s1sky)"/>
      <g id="s1hills"></g>
      <g id="s1roof"></g>
    </svg>
    <div class="sunball"></div>
    <div class="loc">${ic("map")} Campinas/SP</div>
    <div class="veil"></div>
    <div class="title"><div class="h1">E depois da <span class="sun">instalação?</span></div></div>`,
  init(root){
    // telhado em perspectiva com placas — geometria depende do formato
    const roofY = H*(PORTRAIT ? .62 : .58);
    const x0 = -W*.05, x1 = W*1.05;
    const svg = $(root,"#s1roof");
    const hills = $(root,"#s1hills");
    hills.innerHTML = `<path d="M0 ${roofY-H*.06} Q ${W*.25} ${roofY-H*.13} ${W*.5} ${roofY-H*.07} T ${W} ${roofY-H*.09} V ${H} H0Z" fill="#2a2850" opacity=".75"/>`+
      `<path d="M0 ${roofY-H*.02} Q ${W*.3} ${roofY-H*.08} ${W*.62} ${roofY-H*.03} T ${W} ${roofY-H*.04} V ${H} H0Z" fill="#1d1d3c"/>`;
    const top = roofY, bot = H*1.02, inset = W*.16;
    const poly = `${x0+inset},${top} ${x1-inset},${top} ${x1},${bot} ${x0},${bot}`;
    $(root,"#s1roofpoly").setAttribute("points",poly);
    let g = `<polygon points="${poly}" fill="#7a3b2b"/>`;
    // telhas
    for (let i=1;i<9;i++){ const y=lerp(top,bot,i/9); const k=(y-top)/(bot-top); g+=`<line x1="${lerp(x0+inset,x0,k)}" y1="${y}" x2="${lerp(x1-inset,x1,k)}" y2="${y}" stroke="#5e2c20" stroke-width="3"/>`; }
    // placas solares (grade em perspectiva)
    const cols = PORTRAIT ? 4 : 7, rows = 3;
    const py0 = lerp(top,bot,.12), py1 = lerp(top,bot,.78);
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
      const ya = lerp(py0,py1,r/rows)+4, yb = lerp(py0,py1,(r+1)/rows)-4;
      const ka=(ya-top)/(bot-top), kb=(yb-top)/(bot-top);
      const lA=lerp(x0+inset,x0,ka)+W*.06, rA=lerp(x1-inset,x1,ka)-W*.06, lB=lerp(x0+inset,x0,kb)+W*.06, rB=lerp(x1-inset,x1,kb)-W*.06;
      const xa0=lerp(lA,rA,c/cols)+4, xa1=lerp(lA,rA,(c+1)/cols)-4, xb0=lerp(lB,rB,c/cols)+4, xb1=lerp(lB,rB,(c+1)/cols)-4;
      g+=`<polygon points="${xa0},${ya} ${xa1},${ya} ${xb1},${yb} ${xb0},${yb}" fill="url(#s1pan)" stroke="#9fb4d8" stroke-opacity=".55" stroke-width="2"/>`;
      g+=`<line x1="${(xa0+xa1)/2}" y1="${ya}" x2="${(xb0+xb1)/2}" y2="${yb}" stroke="#9fb4d8" stroke-opacity=".25" stroke-width="1.5"/>`;
      g+=`<line x1="${(xa0+xb0)/2}" y1="${(ya+yb)/2}" x2="${(xa1+xb1)/2}" y2="${(ya+yb)/2}" stroke="#9fb4d8" stroke-opacity=".25" stroke-width="1.5"/>`;
    }
    g += `<g clip-path="url(#s1clip)"><rect id="s1glint" x="0" y="${top}" width="${W*.18}" height="${bot-top}" fill="url(#s1glint)" transform="skewX(-25)" opacity=".0"/></g>`;
    svg.innerHTML = g;
    this.roofY = roofY;
  },
  update(root,t){
    const sun = $(root,".sunball");
    const k = p(t,0,3.2,eio);
    // nasce atrás do telhado; depois vira o destaque do logo (centro-alto)
    let sx = W*.72, sy = lerp(this.roofY+U*4, H*.22, k), sc = lerp(.9,1.25,k);
    const m = p(t,4.7,1.2,eio);
    const tx = W/2, ty = H*(PORTRAIT ? .30 : SQUARE ? .2 : .2);
    sx = lerp(sx,tx,m); sy = lerp(sy,ty,m); sc = lerp(sc,.42,m);
    css(sun,{transform:`translate(${sx}px,${sy}px) scale(${sc})`, opacity: 1});
    css($(root,"#s1skyrect"),{filter:`brightness(${lerp(.55,1.08,k)})`});
    const gl = $(root,"#s1glint");
    if (gl){ const gk = clamp((t-1.6)/1.6); gl.setAttribute("x", lerp(-W*.2, W*1.3, gk)); gl.style.opacity = gk>0&&gk<1 ? 1 : 0; }
    css($(root,".veil"),{opacity: p(t,2.8,1.2)});
    rise($(root,".title"),t,3.2,.8,4);
    css($(root,".loc"),{opacity: p(t,.6,.6)*(1-p(t,4.6,.5))});
    css($(root,".title"),{opacity: p(t,3.2,.8)*(1-p(t,5.3,.6))});

const SOON = [["sheet","Planilha de instalações 100% sincronizada"],["users","“Quem vai?” direto na agenda do dia"],["plug","Auxsol e outras marcas de inversor"],["bell","Avisos automáticos ao cliente a cada etapa"],["user","Portal para toda a carteira de clientes"]];
S({ id:11, name:"Em breve", dur:6,
  html: () => `<div class="bg-glow"></div>
    <div class="lay">
      <div class="badgebig">EM BREVE</div>
      <div class="cards">${SOON.map(([i,n])=>`<div class="soon"><span class="pill">EM BREVE</span>${ic(i)}<b>${n}</b></div>`).join("")}</div>
    </div>`,
  update(root,t,dur){
    pop($(root,".badgebig"),t,0,.55);
    const cards = $$(root,".soon");
    const z = p(t,dur-.8,.75,eio);
    cards.forEach((el,i)=>{
      const k = p(t,.55+i*.55,.5);
      let tr = `translateY(${(1-k)*U*4}px)`;
      if (z>0){ const [cx,cy]=center(el,root); tr = `translate(${(W/2-cx)*z}px,${(H/2-cy)*z}px) scale(${lerp(1,.1,z)})`; }
      css(el,{opacity:k*.92*(1-z), transform:tr});
    });
    css($(root,".badgebig"),{opacity:p(t,0,.3)*(1-z)});
  },
  sfx: [[.1,"pop"],[.55,"soft"],[1.1,"soft"],[1.65,"soft"],[2.2,"soft"],[2.75,"soft"],[5.3,"whoosh"]],
});

/* ---------- 12. Encerramento ---------- */
S({ id:12, name:"Encerramento", dur:4,
  html: () => `<div class="bg-glow"></div>

      <div class="brand">

/* ================= montagem da linha do tempo ================= */
const ACTIVE = SCENES.filter(s => !CUT || ![3,4,6].includes(s.id));
let acc = 0;
for (const s of ACTIVE){ s.start = acc; acc += s.dur; }
const TOTAL = acc;
const XF = .5; // crossfade entre cenas

const stage = document.getElementById("stage");
stage.dataset.f = FMT;
stage.style.width = W+"px"; stage.style.height = H+"px";
document.documentElement.style.setProperty("--u", U+"px");
for (const s of ACTIVE){
  const el = document.createElement("section");
  el.className = "scene"; el.id = "s"+s.id; el.innerHTML = s.html();
  stage.appendChild(el); s.el = el;
  if (s.init) s.init(el);
}

function renderAt(T){
  T = clamp(T,0,TOTAL);
  ACTIVE.forEach((s,i)=>{
    const local = T - s.start;
    const next = ACTIVE[i+1];
    const visible = local >= 0 && (local < s.dur || (next && local < s.dur + XF) || (!next && local <= s.dur));
    if (!visible){ s.el.style.visibility="hidden"; s.el.style.opacity=0; return; }
    s.el.style.visibility = "visible";
    s.el.style.opacity = i===0 ? 1 : clamp(local/XF);
    s.update(s.el, Math.min(local, s.dur + XF), s.dur);
  });
  // fade final para preto nos últimos 0,6 s
  stage.style.filter = T > TOTAL-.6 ? `brightness(${clamp((TOTAL-T)/.6)*.6+.4})` : "none";
  return T;
}
const SFX = ACTIVE.flatMap(s => (s.sfx||[]).map(([t,k]) => ({ t: +(s.start+t).toFixed(3), k })));
window.COMMERCIAL = { W, H, FMT, CUT, TOTAL, SFX, scenes: ACTIVE.map(s=>({id:s.id,name:s.name,start:s.start,dur:s.dur})) };
window.renderAt = renderAt;

/* ================= pré-visualização ================= */
function fit(){
  const ctlH = Q.get("render") ? 0 : 56;
  VIEW_SCALE = Math.min(innerWidth/W, (innerHeight-ctlH)/H);
  stage.style.transform = `scale(${VIEW_SCALE})`;
  document.getElementById("wrap").style.bottom = ctlH+"px";
}
if (Q.get("render")){
  document.getElementById("wrap").style.cssText = "position:absolute;left:0;top:0;display:block";
  document.body.style.background = "var(--navy)";
  VIEW_SCALE = 1;
  renderAt(+Q.get("t")||0);
} else {
  addEventListener("resize",fit); fit();
  const ctl = document.getElementById("ctl"); ctl.hidden = false;
  const scrub = document.getElementById("scrub"), tc = document.getElementById("tc"), scn = document.getElementById("scn"), play = document.getElementById("play");
  scrub.max = TOTAL;
  let t = +Q.get("t")||0, playing = !Q.get("t"), last = performance.now();
  const audio = new Audio(`videos/ag-power-comercial-${CUT ? "60s" : "90s"}-16x9.mp4`); // áudio do vídeo renderizado audio.preload = "auto";
  const syncAudio = () => { if (!audio.error){ audio.currentTime = t; playing ? audio.play().catch(()=>{}) : audio.pause(); } };
  const show = () => { renderAt(t); scrub.value = t; tc.textContent = t.toFixed(1)+" s / "+TOTAL+" s"; const s = ACTIVE.find(s=>t>=s.start && t<s.start+s.dur) || ACTIVE[ACTIVE.length-1]; scn.textContent = `Cena ${s.id} — ${s.name}`; play.textContent = playing ? "❚❚" : "▶︎"; };
  play.onclick = () => { playing = !playing; if (t>=TOTAL) t=0; syncAudio(); show(); };
  scrub.oninput = () => { t = +scrub.value; syncAudio(); show(); };
  document.querySelectorAll("#ctl [data-f]").forEach(b => { b.classList.toggle("on", b.dataset.f===FMT); b.onclick = () => { Q.set("f", b.dataset.f); Q.delete("t"); location.search = Q; }; });
  const cutB = document.getElementById("cut"); cutB.classList.toggle("on", CUT);
  cutB.onclick = () => { CUT ? Q.delete("cut") : Q.set("cut","60"); Q.delete("t"); location.search = Q; };
  addEventListener("keydown", e => { if (e.code==="Space"){ e.preventDefault(); play.click(); } });
  const loop = now => { const dt = (now-last)/1000; last = now; if (playing){ t += dt; if (t>=TOTAL){ t=TOTAL; playing=false; audio.pause(); } } show(); requestAnimationFrame(loop); };
  if (playing) syncAudio();
  requestAnimationFrame(loop);
}
</script>
